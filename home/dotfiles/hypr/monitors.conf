# Display setup
# Laptop panel (left, high refresh)
monitor = eDP-1, 1920x1080@240, 0x0, 1

# DP monitor (center, 144 Hz)
monitor = DP-4, 1920x1080@144, 1920x0, 1

# Samsung HDMI monitor (right)
monitor = HDMI-A-1, 1920x1080@60, 3840x0, 1

#workspace = 1, monitor:eDP-1
#workspace = 2, monitor:DP-4
#workspace = 3, monitor:HDMI-A-1

env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __GL_MaxFramesAllowed,1
